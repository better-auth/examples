name: React Router example

on:
  push:
    branches: [main, tia-55-react-router-example]
  pull_request:
    paths:
      - "react-router-example/**"
      - ".github/workflows/react-router-example.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-router-example
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-only-secret' }}
      MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
      MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: npm rebuild better-sqlite3
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
